<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather Forecast (Simulation)</title>
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(to bottom, #004e92, #000428); color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
    h1 { margin-top: 30px; }
    .container { width: 90%; max-width: 600px; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.4); margin-top: 20px; }
    .search { display: flex; gap: 10px; }
    input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
    button { background: #007bff; border: none; color: white; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    button:hover { background: #005fcc; }
    .weather-box { margin-top: 20px; text-align: center; }
    .temp { font-size: 48px; font-weight: bold; }
    .forecast { display: flex; justify-content: space-around; margin-top: 20px; }
    .day { background: rgba(255,255,255,0.15); padding: 10px; border-radius: 8px; text-align: center; width: 100px; }
  </style>
</head>
<body>
  <h1>Weather Forecast (Demo)</h1>
  <div class="container">
    <div class="search">
      <input type="text" id="city" placeholder="Enter city name (e.g. Chennai)" />
      <button onclick="getWeather()">Search</button>
    </div>
    <div class="weather-box" id="weatherBox" style="display:none;">
      <h2 id="cityName"></h2>
      <div class="temp" id="temp"></div>
      <p id="desc"></p>
      <div class="forecast" id="forecast"></div>
    </div>
  </div>

  <script>
    const sampleData = {
      "chennai": {
        temp: 32,
        desc: "Sunny",
        forecast: [
          { day: "Mon", temp: 33, desc: "Clear" },
          { day: "Tue", temp: 31, desc: "Partly Cloudy" },
          { day: "Wed", temp: 29, desc: "Rain" },
          { day: "Thu", temp: 30, desc: "Thunderstorms" },
          { day: "Fri", temp: 34, desc: "Hot" }
        ]
      },
      "delhi": {
        temp: 28,
        desc: "Cloudy",
        forecast: [
          { day: "Mon", temp: 29, desc: "Cloudy" },
          { day: "Tue", temp: 30, desc: "Sunny" },
          { day: "Wed", temp: 27, desc: "Rain" },
          { day: "Thu", temp: 26, desc: "Foggy" },
          { day: "Fri", temp: 28, desc: "Clear" }
        ]
      },
      "mumbai": {
        temp: 30,
        desc: "Rainy",
        forecast: [
          { day: "Mon", temp: 29, desc: "Rain" },
          { day: "Tue", temp: 30, desc: "Partly Cloudy" },
          { day: "Wed", temp: 31, desc: "Sunny" },
          { day: "Thu", temp: 30, desc: "Rain" },
          { day: "Fri", temp: 32, desc: "Clear" }
        ]
      }
    };

    function getWeather() {
      const cityInput = document.getElementById('city').value.trim().toLowerCase();
      const weatherBox = document.getElementById('weatherBox');
      const cityName = document.getElementById('cityName');
      const temp = document.getElementById('temp');
      const desc = document.getElementById('desc');
      const forecast = document.getElementById('forecast');

      if (sampleData[cityInput]) {
        const data = sampleData[cityInput];
        cityName.textContent = cityInput.charAt(0).toUpperCase() + cityInput.slice(1);
        temp.textContent = `${data.temp}°C`;
        desc.textContent = data.desc;
        forecast.innerHTML = data.forecast.map(f => `<div class='day'><h4>${f.day}</h4><p>${f.temp}°C</p><small>${f.desc}</small></div>`).join('');
        weatherBox.style.display = 'block';
      } else {
        cityName.textContent = 'City not found';
        temp.textContent = '';
        desc.textContent = 'Try Chennai, Delhi, or Mumbai';
        forecast.innerHTML = '';
        weatherBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
