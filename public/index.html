<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Forecast — Clean UI</title>
<style>
:root{
--bg:#0f1724;
--card:#0b1220;
--muted:#9aa7b2;
--accent:#60a5fa;
--glass: rgba(255,255,255,0.03);
--success: #10b981;
color-scheme: dark;
font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:linear-gradient(180deg,#071126 0%, #081527 100%);color:#e6eef6}
.container{max-width:980px;margin:32px auto;padding:20px}


header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--muted);font-size:0.9rem}


.search-row{display:flex;gap:10px;margin-top:18px}
.search-box{flex:1;display:flex;gap:8px;align-items:center;background:var(--card);padding:10px;border-radius:12px;box-shadow:0 6px 18px rgba(4,8,15,0.6)}
input[type="search"]{flex:1;background:transparent;border:none;color:inherit;font-size:1rem;outline:none}
button{background:linear-gradient(90deg,var(--accent),#3b82f6);border:none;padding:10px 14px;border-radius:10px;color:white;font-weight:600;cursor:pointer}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;border-radius:10px;color:var(--muted);cursor:pointer}


.layout{display:grid;grid-template-columns:1fr 360px;gap:18px;margin-top:20px}
@media (max-width:900px){.layout{grid-template-columns:1fr;}.container{padding:12px}}


.card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:18px;border-radius:14px;box-shadow:0 8px 30px rgba(2,6,12,0.6)}


.current{display:flex;gap:18px;align-items:center}
.temp{font-size:3.6rem;font-weight:700}
.details{color:var(--muted)}


.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.meta span{background:var(--glass);padding:8px;border-radius:8px;font-size:0.9rem;color:var(--muted)}


.forecast-grid{display:flex;gap:10px;margin-top:16px;overflow-x:auto;padding-bottom:6px}
.day{min-width:110px;padding:10px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));text-align:center}
.day small{display:block;color:var(--muted);margin-top:6px}


.side{position:sticky;top:28px}
.card h3{margin:0 0 6px 0}


.error{background:#3b0d0d;color:#ffb4b4;padding:10px;border-radius:8px;margin-top:8px}


footer{margin-top:22px;color:var(--muted);font-size:0.9rem}


/* loader */
.lds-ring{display:inline-block;position:relative;width:36px;height:36px}
.lds-ring div{box-sizing:border-box;display:block;position:absolute;width:30px;height:30px;margin:4px;border:3px solid #3b82f6;border-radius:50%;animation:lds-ring 1.2s linear infinite;border-color:#3b82f6 transparent transparent transparent}
@keyframes lds-ring{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}


/* small touches */
.muted{color:var(--muted)}
.center{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="container">
</html>
